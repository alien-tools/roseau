name: Publish release from tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Validate project and tag versions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(./mvnw --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -q -DforceStdout -Dstyle.color=never)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "The release pipeline requires a non-SNAPSHOT project version; found $version" >&2
            exit 1
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME does not match project version $version (expected v$version)" >&2
            exit 1
          fi
          echo "Validated release candidate version $version"

  verify:
    name: Verify (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify build
        run: ${{ runner.os == 'Windows' && 'mvn' || './mvnw' }} --batch-mode -Pinclude-smoke verify

  stage:
    name: Stage Maven artifacts
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and stage Maven artifacts
        run: ./mvnw --batch-mode -DskipTests deploy -DaltDeploymentRepository=local::file:target/staging-deploy
      - name: Archive Maven staging repository
        run: tar -C target -czf target/maven-staging.tar.gz staging-deploy
      - name: Upload Maven staging repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-staging
          path: target/maven-staging.tar.gz
          if-no-files-found: error
      - name: Upload shaded CLI JAR
        uses: actions/upload-artifact@v7
        with:
          name: single-jar
          path: cli/target/roseau-[0-9]*.jar
          if-no-files-found: error

  assemble-jlink:
    name: Assemble jlink ${{ matrix.platform }}
    needs: stage
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch_64
          - runner: macos-15-intel
            platform: osx-x86_64
          - runner: macos-latest
            platform: osx-aarch_64
          - runner: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build CLI artifacts
        run: ${{ runner.os == 'Windows' && 'mvn' || './mvnw' }} --batch-mode -pl cli -am -DskipTests clean package
      - name: Assemble jlink archive
        run: ${{ runner.os == 'Windows' && 'mvn' || './mvnw' }} --batch-mode -N jreleaser:assemble -Djreleaser.config.file=jreleaser.yml -Djreleaser.assemble.jlink.roseau-standalone.jdk.path="$JAVA_HOME" -Djreleaser.assemble.jlink.roseau-standalone.jdk.platform="${{ matrix.platform }}"
      - name: Upload jlink archive
        uses: actions/upload-artifact@v7
        with:
          name: jlink-${{ matrix.platform }}
          path: target/jreleaser/assemble/roseau-standalone/jlink/*.zip
          if-no-files-found: error

  publish:
    name: Validate or publish with JReleaser
    needs:
      - stage
      - assemble-jlink
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Download Maven staging repository
        uses: actions/download-artifact@v8
        with:
          name: maven-staging
          path: target
      - name: Restore Maven staging repository
        run: tar -C target -xzf target/maven-staging.tar.gz
      - name: Download shaded CLI JAR
        uses: actions/download-artifact@v8
        with:
          name: single-jar
          path: cli/target
      - name: Download jlink archives
        uses: actions/download-artifact@v8
        with:
          pattern: jlink-*
          merge-multiple: true
          path: target/jreleaser/assemble/roseau-standalone/jlink
      - name: Validate release configuration and generate notes
        if: github.event_name == 'workflow_dispatch'
        run: ./mvnw --batch-mode -N jreleaser:config jreleaser:changelog -Djreleaser.config.file=jreleaser.yml -Djreleaser.dry.run=true
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_RELEASE_DEPLOY_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          JRELEASER_MAVENCENTRAL_RELEASE_DEPLOY_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      - name: Upload dry-run release notes
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-notes
          path: target/jreleaser/release/CHANGELOG.md
          if-no-files-found: error
      - name: Publish release with JReleaser
        if: github.event_name == 'push'
        run: ./mvnw --batch-mode -N jreleaser:full-release -Djreleaser.config.file=jreleaser.yml
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_RELEASE_DEPLOY_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          JRELEASER_MAVENCENTRAL_RELEASE_DEPLOY_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
